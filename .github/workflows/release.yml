name: Release

# Pushing a tag v<version> publishes the release that install.sh and the
# updater follow. The job refuses a tag that does not match the packages,
# then creates the release with three files attached: install.sh, the tag's
# tree as clashwrt-<tag>.tar.gz (git archive, so the bytes do not change the
# way GitHub's on-the-fly archives may) and SHA256SUMS. GitHub records a
# SHA-256 for every attached file, and the installer and the updater refuse a
# download that does not match it.
#
# The notes come from the annotated tag's message:
#   git tag -a v1.0.4 -F notes.md && git push origin v1.0.4
# A lightweight tag gets the subjects of the commits since the previous tag
# (version bumps left out), not GitHub's one-line "Full Changelog" link.
# A release that already exists (made by hand with gh or on the web) is left
# as it is; the checks still run against its tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the previous tag and the commits since it, for the notes
          fetch-depth: 0

      - name: Tools
        run: sudo apt-get install -y -qq gettext >/dev/null

      - name: Check
        run: tools/check.sh "$GITHUB_REF_NAME"

      - name: Assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="clashwrt-$TAG/" -o "dist/clashwrt-$TAG.tar.gz" HEAD
          cp install.sh dist/install.sh
          (cd dist && sha256sum "clashwrt-$TAG.tar.gz" install.sh > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; attaching the files it lacks"
            have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for f in dist/*; do
              echo "$have" | grep -qxF "${f#dist/}" || gh release upload "$TAG" "$f"
            done
            exit 0
          fi
          # actions/checkout fetches the tag as a lightweight ref; the
          # annotation is needed for --notes-from-tag
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # a lightweight tag has no message to take the notes from
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            notes=--notes-from-tag
          else
            prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            {
              echo "ClashWrt ${TAG#v}"
              echo
              git log --format='- %s' ${prev:+"$prev.."}"$TAG" | grep -vE '^- [0-9]+\.[0-9]+\.[0-9]+$' || true
              if [ -n "$prev" ]; then
                echo
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
              fi
            } > notes.md
            cat notes.md
            notes=--notes-file=notes.md
          fi
          gh release create "$TAG" --verify-tag \
            --title "ClashWrt ${TAG#v}" "$notes" dist/*
