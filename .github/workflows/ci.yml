name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # shellcheck, node and python3 ship with the runner image; msgfmt does not.
      - name: Tools
        run: |
          set -o pipefail
          sudo apt-get install -y -qq gettext >/dev/null
          shellcheck --version | head -n2
          msgfmt --version | head -n1
          node --version
          python3 --version

      - name: Check
        run: tools/check.sh

      # backup and install write to / and need root: a throwaway busybox
      # container, which is also what OpenWrt's shell is
      - name: Sandbox tests
        run: |
          for t in backup install; do
            docker run --rm --network none -e CLASHWRT_SANDBOX=1 -v "$PWD:/src:ro" alpine:3.21 sh "/src/tests/$t.test.sh" || exit 1
          done
